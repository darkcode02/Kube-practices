apiVersion: v1
kind: Pod
metadata:
  name: cpu-demo
spec:
  containers:
    - name: cpu-demo-ctr
      image: vish/stress
      resources:
        limits:
          cpu: "100"
        requests:
          cpu: "100" # n este caso el pod quedara en pending porque no hay recursos disponibles para satisfacer la solicitud
      args: ["-cpus", "2"]

