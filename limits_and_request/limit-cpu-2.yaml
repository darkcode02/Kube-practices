# Ejemplo: solicitud de CPU exagerada para observar un Pod en Pending.
# Kubernetes no programa el Pod si ningún nodo puede satisfacer los requests.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-demo
spec:
  containers:
    - name: cpu-demo-ctr
      image: vish/stress
      resources:
        limits:
          cpu: "100"
        requests:
          cpu: "100" # En este caso el Pod quedará en Pending por falta de CPU disponible.
      args: ["-cpus", "2"]
