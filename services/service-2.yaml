# Ejemplo: backend Node.js expuesto con un Service NodePort.
# Practica la relación Deployment -> Pods -> Service usando labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app: back
spec:
  replicas: 3
  selector:
    # Selector del Deployment: debe coincidir con template.metadata.labels.
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
      - name: back-container
        image: node:20
        ports:
        - containerPort: 80
        # Levanta un servidor HTTP simple dentro del contenedor para el laboratorio.
        command: ["npx", "http-server", "-p", "80"]
---
apiVersion: v1
kind: Service
metadata:
  name: back-service
  labels:
    app: back
spec:
  type: NodePort
  selector:
    # El Service enviará tráfico solo a Pods con app=back.
    app: back
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80  
