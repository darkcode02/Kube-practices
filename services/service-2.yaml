apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  labels:
    app: back
spec:
  replicas: 3
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
      - name: back-container
        image: node:20
        ports:
        - containerPort: 80
        command: ["npx", "http-server", "-p", "80"]
---
apiVersion: v1
kind: Service
metadata:
  name: back-service
  labels:
    app: back
spec:
  type: NodePort
  selector:
    app: back
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80  