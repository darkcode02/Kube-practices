# Ejemplo: Service sin type explícito; Kubernetes usa ClusterIP por defecto.
# Útil para ver cómo un Service interno balancea tráfico hacia varias réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-1-deployment
  labels:
    app: service-1
spec:
  replicas: 3
  selector:
    # Une el Deployment con los Pods creados desde el template.
    matchLabels:
      app: service-1
  template:
    metadata:
      labels:
        app: service-1
    spec:
      containers:
      - name: service-1-container
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service-1-service
  labels:
    app: service-1
spec:
  selector:
    # Une el Service con los Pods del Deployment.
    app: service-1
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80
