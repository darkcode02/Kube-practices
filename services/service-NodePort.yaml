# Ejemplo: Service NodePort para exponer una app fuera del cluster local.
# NodePort abre un puerto en cada nodo y lo redirige al Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-3-deployment
  labels:
    app: service-3
spec:
  replicas: 3
  selector:
    # El Deployment administra Pods con app=service-3.
    matchLabels:
      app: service-3
  template:
    metadata:
      labels:
        app: service-3
    spec:
      containers:
      - name: service-3-container
        image: nginx:alpine
        ports:
        - containerPort: 80
      
---
apiVersion: v1
kind: Service
metadata:
  name: service-3-service
  labels:
    app: service-3
spec:
  # NodePort permite probar el servicio desde fuera del cluster, por ejemplo en Minikube.
  type: NodePort
  selector:
    app: service-3
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80
