# Ejemplo: scheduling con nodeSelector.
# El Pod solo podrá ejecutarse en nodos que tengan la label lab=scheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeselector-demo
  labels:
    app: nodeselector-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeselector-demo
  template:
    metadata:
      labels:
        app: nodeselector-demo
    spec:
      # Requiere etiquetar un nodo antes, por ejemplo: kubectl label node <node> lab=scheduling
      nodeSelector:
        lab: scheduling
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
