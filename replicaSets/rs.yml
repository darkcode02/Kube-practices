# Ejemplo: ReplicaSet básico.
# Mantiene siempre tres Pods con la label app=pod-label.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-test
  labels:
    app: rs-test
spec:
  replicas: 3
  selector:
    # El selector debe coincidir con las labels del template.
    matchLabels:
      app: pod-label
  template:
    metadata:
      labels:
        app: pod-label
    spec:
      containers:
      - name: container1
        image: nginx:latest
      
