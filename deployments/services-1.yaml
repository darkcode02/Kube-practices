# Ejemplo: Deployment expuesto por Service.
# El Service usa la label role=hello para enviar tráfico a las tres réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  selector:
    # El Deployment controla los Pods con role=hello.
    matchLabels:
      role: hello
  template:
    metadata:
      labels:
        role: hello
    spec:
      containers:
      - name: hello
        image: gcr.io/google-samples/hello-app:1.0
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    # El Service descubre endpoints usando la misma label del template.
    role: hello
