# Ejemplo: primer Deployment de nginx.
# Un Deployment mantiene la cantidad deseada de réplicas y facilita actualizaciones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector: 
    # Debe coincidir con template.metadata.labels para que el Deployment adopte sus Pods.
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx #debe coincidir con las labels del deployment
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
          - containerPort: 80
