# Ejemplo: Deployment con annotation de change-cause para estudiar rollouts.
# La annotation queda visible en el historial cuando se revisan cambios del Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: "cambio imagen fake"
  name: deployment-test
  labels:
    app: front
spec:
  replicas: 3
  selector: 
    # Debe coincidir con template.metadata.labels.
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front #debe coincidir con las labels del deployment
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
          # Puerto expuesto dentro del contenedor para el ejemplo.
          - containerPort: 100
