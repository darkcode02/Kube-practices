# Ejemplo: Deployment + Service para practicar DNS interno de Kubernetes.
# El Service crea el nombre echo-service, resoluble desde otros Pods del cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  labels:
    app: echo
spec:
  replicas: 2
  selector:
    # El selector conecta el Deployment con los Pods que crea.
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=respuesta desde el servicio echo"
          ports:
            - containerPort: 5678
---
# Service ClusterIP: balancea tráfico hacia las réplicas y expone un DNS estable.
apiVersion: v1
kind: Service
metadata:
  name: echo-service
spec:
  # Debe coincidir con template.metadata.labels del Deployment.
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 5678
