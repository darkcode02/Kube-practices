# Ejemplo: NetworkPolicy que restringe el tráfico hacia un backend.
# Objetivo: ver cómo una label en el cliente controla quién puede conectarse al Pod protegido.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-backend
  labels:
    app: secure-backend
spec:
  replicas: 1
  selector:
    # El Deployment administra solo Pods con esta label.
    matchLabels:
      app: secure-backend
  template:
    metadata:
      labels:
        app: secure-backend
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-text=solo clientes permitidos"
          ports:
            - containerPort: 5678
---
# Service interno que da un nombre DNS estable al backend protegido.
apiVersion: v1
kind: Service
metadata:
  name: secure-backend
spec:
  # Este selector debe coincidir con las labels del Pod del backend.
  selector:
    app: secure-backend
  ports:
    - port: 80
      targetPort: 5678
---
# Cliente permitido: tiene la label access=allowed que usará la NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allowed-client
  labels:
    app: allowed-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allowed-client
  template:
    metadata:
      labels:
        app: allowed-client
        # Esta label es la diferencia entre poder o no poder entrar al backend.
        access: allowed
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
# Regla de red: por defecto bloquea ingress al backend salvo las fuentes declaradas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-labeled-clients
spec:
  # Selecciona el Pod que se quiere proteger.
  podSelector:
    matchLabels:
      app: secure-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              # Solo Pods con esta label podrán enviar tráfico al puerto permitido.
              access: allowed
      ports:
        - protocol: TCP
          port: 5678
