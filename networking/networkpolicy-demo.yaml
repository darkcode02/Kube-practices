apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-backend
  labels:
    app: secure-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-backend
  template:
    metadata:
      labels:
        app: secure-backend
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args:
            - "-text=solo clientes permitidos"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: secure-backend
spec:
  selector:
    app: secure-backend
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allowed-client
  labels:
    app: allowed-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allowed-client
  template:
    metadata:
      labels:
        app: allowed-client
        access: allowed
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-labeled-clients
spec:
  podSelector:
    matchLabels:
      app: secure-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: 5678
