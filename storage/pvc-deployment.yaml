# Ejemplo: PersistentVolumeClaim montado dentro de un Deployment.
# Muestra cómo separar el ciclo de vida del almacenamiento del ciclo de vida del Pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-html-pvc
spec:
  # ReadWriteOnce permite montar el volumen en un nodo a la vez.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Deployment que consume el PVC para servir archivos desde la ruta HTML de nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-demo
  labels:
    app: pvc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-demo
  template:
    metadata:
      labels:
        app: pvc-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # Monta el almacenamiento persistente donde nginx busca contenido estático.
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          persistentVolumeClaim:
            # Vincula este volumen del Pod con el PVC declarado arriba.
            claimName: nginx-html-pvc
