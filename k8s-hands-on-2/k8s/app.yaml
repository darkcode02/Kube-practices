# Aplicación Vanta Wear: API + frontend Express conectada a PostgreSQL.
# Este manifiesto despliega la app y la expone con NodePort para pruebas locales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanta-store
spec:
  replicas: 1
  selector:
    # Debe coincidir con template.metadata.labels.
    matchLabels:
      app: vanta-store
  template:
    metadata:
      labels:
        app: vanta-store
    spec:
      containers:
        - name: vanta-store
          image: vanta-wear:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # PORT configura Express; las variables DB conectan con el Service de Postgres.
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: vanta-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  # Las credenciales se leen desde el Secret definido en postgres.yaml.
                  name: vanta-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vanta-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vanta-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            # Evita enviar tráfico antes de que la app y la base de datos respondan.
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            # Reinicia la app si el endpoint de salud deja de responder.
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
# Service público del laboratorio para abrir la tienda desde el host.
apiVersion: v1
kind: Service
metadata:
  name: vanta-store
spec:
  type: NodePort
  selector:
    # Envía tráfico a los Pods del Deployment vanta-store.
    app: vanta-store
  ports:
    - name: http
      port: 80
      targetPort: 3000
      # Puerto fijo elegido para simplificar las pruebas del ejemplo.
      nodePort: 30080
