apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanta-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vanta-store
  template:
    metadata:
      labels:
        app: vanta-store
    spec:
      containers:
        - name: vanta-store
          image: vanta-wear:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: vanta-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: vanta-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vanta-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vanta-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vanta-store
spec:
  type: NodePort
  selector:
    app: vanta-store
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
