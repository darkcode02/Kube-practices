apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_USER: training_user
  DB_PASSWORD: change-me-in-real-life
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-env-demo
  labels:
    app: secret-env-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-env-demo
  template:
    metadata:
      labels:
        app: secret-env-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo user=$DB_USER password_length=${#DB_PASSWORD}; sleep 20; done"]
          envFrom:
            - secretRef:
                name: db-credentials
