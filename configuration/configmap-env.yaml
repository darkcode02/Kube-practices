apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env-config
data:
  APP_MODE: "training"
  APP_COLOR: "blue"
  APP_MESSAGE: "configuracion desde ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-env-demo
  labels:
    app: configmap-env-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-env-demo
  template:
    metadata:
      labels:
        app: configmap-env-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do env | grep APP_; sleep 20; done"]
          envFrom:
            - configMapRef:
                name: app-env-config
