# Ejemplo: recursos aislados dentro del namespace ci.
# Sirve para practicar cómo namespace, Deployment y Service trabajan juntos.
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    name: ci
---
# Deployment creado explícitamente dentro del namespace ci.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ci
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    # Relaciona el Deployment con sus Pods.
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: CLUSTER_NAME
              value: "minikube"
          ports:
            - name: http
              containerPort: 8080
---
# Service dentro del mismo namespace; solo descubre Pods de ci con app=backend.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ci
spec:
  type: ClusterIP
  selector:
    # La label debe coincidir con las labels del template del Deployment.
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
