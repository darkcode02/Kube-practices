apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: front
data:
  test: hola
  test.conf: |
    server {
      listen 9090;
      location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
      }
      error_page 404 /404.html;
      location = /404.html {
        root /usr/share/nginx/html;
        internal;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-test
  labels:
    app: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
          items:
          - key: test.conf
            path: default.conf
          - key: test
            path: test.txt