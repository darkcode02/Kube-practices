# Backend del laboratorio k8s-hands-on.
# Expone una API HTTP interna con probes, recursos y seguridad básica del contenedor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    # El Deployment solo administra Pods con app=backend.
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          env:
            # Variables visibles desde la API para comprobar configuración del entorno.
            - name: APP_VERSION
              value: "2.0.0"
            - name: CLUSTER_NAME
              value: "minikube"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # /readyz decide si el Pod puede recibir tráfico.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            # /healthz decide si el contenedor debe reiniciarse.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            # Reduce privilegios del proceso dentro del contenedor.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
# ClusterIP: el backend queda disponible dentro del cluster para el frontend.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    # Selecciona las réplicas del backend.
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
