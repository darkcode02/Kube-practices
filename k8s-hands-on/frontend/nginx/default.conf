# nginx sirve el frontend y reenvía las llamadas /api al Service backend del cluster.
server {
    listen 80;
    server_name _;

    # Archivos estáticos copiados por el Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Permite que una SPA recargue cualquier ruta y vuelva a index.html.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Nombre DNS interno del Service backend en el namespace default.
        proxy_pass http://backend.default.svc.cluster.local;
        proxy_http_version 1.1;
        # Headers habituales para que el backend conozca el host y origen real.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
