# Ejemplo de debugging: Deployment que entra en CrashLoopBackOff a propósito.
# El comando termina con exit 1, por eso Kubernetes reinicia el contenedor repetidamente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  labels:
    app: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: failing-app
          image: busybox:1.36
          # Falla intencional para practicar kubectl logs, describe y eventos.
          command: ["sh", "-c", "echo 'fallo intencional'; exit 1"]
