# Ejemplo de debugging: readinessProbe mal configurada.
# nginx responde en /, pero la probe apunta a /healthz, así que el Pod no queda Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-readiness-demo
  labels:
    app: broken-readiness-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-readiness-demo
  template:
    metadata:
      labels:
        app: broken-readiness-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              # Ruta incorrecta para provocar fallos de readiness.
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
# El Service no tendrá endpoints listos mientras la readinessProbe falle.
apiVersion: v1
kind: Service
metadata:
  name: broken-readiness-service
spec:
  selector:
    app: broken-readiness-demo
  ports:
    - port: 80
      targetPort: 80
